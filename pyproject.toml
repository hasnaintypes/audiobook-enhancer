[project]
name = "audiobook-engine"
version = "0.0.0"
description = "Tiered DSP/AI enhancement pipeline for long-form narration, preserving narrator voice identity."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audiobook_engine*", "api*"]
